[package]
name = "kafka-api-version-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
