[package]
name = "memkafka-rust-acceptance"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rskafka = { version = "=0.6.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

