name: Publish container

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jonas-lomholdt/memkafka

jobs:
  verify_release:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  publish:
    needs:
      - verify_release
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/') &&
          needs.verify_release.result == 'success'
        )
      )
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && 'memkafka-publish-main' || format('memkafka-publish-release-{0}', github.ref_name) }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out exact verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve publish context
        id: publish_context
        env:
          MEMKAFKA_PUBLISH_REF: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
          MEMKAFKA_PUBLISH_REF_NAME: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          MEMKAFKA_PUBLISH_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: scripts/ci/resolve-publish-context.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Generate primary image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.publish_context.outputs.primary_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/jonas-lomholdt/memkafka
            org.opencontainers.image.description=Fast, single-binary, in-memory Kafka-compatible broker for development and integration tests
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.publish_context.outputs.target_sha }}
            org.opencontainers.image.version=${{ steps.publish_context.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish primary image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Promote fresh mutable aliases from primary digest
        env:
          ALIAS_CANDIDATES: ${{ steps.publish_context.outputs.alias_candidates }}
          CHANNEL: ${{ steps.publish_context.outputs.channel }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH_REF_NAME: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          TARGET_SHA: ${{ steps.publish_context.outputs.target_sha }}
          VERSION: ${{ steps.publish_context.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Refusing unexpected Buildx manifest digest: %s\n' "$DIGEST" >&2
            exit 1
          fi

          image="$REGISTRY/$IMAGE_NAME"

          promote_aliases() {
            local aliases="$1"
            local alias=""
            local promotion_args=()

            while IFS= read -r alias; do
              [[ -n "$alias" ]] || continue
              if ! grep -Fx -- "$alias" <<< "$ALIAS_CANDIDATES" >/dev/null; then
                printf 'Refusing unexpected alias from freshness selection: %s\n' "$alias" >&2
                exit 1
              fi
              promotion_args+=(--tag "$image:$alias")
            done <<< "$aliases"

            if (( ${#promotion_args[@]} == 0 )); then
              printf 'No mutable aliases are eligible for promotion\n'
              return
            fi

            docker buildx imagetools create \
              "${promotion_args[@]}" \
              "$image@$DIGEST"
          }

          if [[ "$CHANNEL" == "main" ]]; then
            remote_main_line="$(git ls-remote --exit-code origin refs/heads/main)"
            IFS=$'\t ' read -r remote_main_sha _ <<< "$remote_main_line"

            if [[ "$remote_main_sha" != "$TARGET_SHA" ]]; then
              printf 'Skipping edge: remote main moved from %s to %s\n' \
                "$TARGET_SHA" "$remote_main_sha"
              exit 0
            fi

            promote_aliases "$ALIAS_CANDIDATES"
            exit 0
          fi

          if [[ "$CHANNEL" != "release" ]]; then
            printf 'Refusing unexpected publication channel: %s\n' "$CHANNEL" >&2
            exit 1
          fi

          remote_release_lines="$(
            git ls-remote --exit-code --tags origin \
              "refs/tags/$PUBLISH_REF_NAME" \
              "refs/tags/$PUBLISH_REF_NAME^{}"
          )"
          remote_release_sha="$(
            awk '
              NR == 1 { direct = $1 }
              $2 ~ /\^\{\}$/ { peeled = $1 }
              END { print peeled != "" ? peeled : direct }
            ' <<< "$remote_release_lines"
          )"

          if [[ "$remote_release_sha" != "$TARGET_SHA" ]]; then
            printf 'Refusing alias promotion: remote %s resolves to %s, expected %s\n' \
              "$PUBLISH_REF_NAME" "$remote_release_sha" "$TARGET_SHA" >&2
            exit 1
          fi

          aliases="$(
            git ls-remote --tags --refs --exit-code origin 'refs/tags/v*' \
              | awk '{ sub(/^refs\/tags\//, "", $2); print $2 }' \
              | scripts/ci/select-release-aliases.sh "$VERSION"
          )"
          promote_aliases "$aliases"
