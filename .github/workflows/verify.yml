name: Full verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify publication policy
        run: tests/publish-ref-behavior.sh

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check throughput benchmark formatting
        run: >-
          cargo fmt
          --manifest-path benchmarks/throughput/Cargo.toml
          -- --check

      - name: Run Clippy on throughput benchmark
        run: >-
          cargo clippy --locked
          --manifest-path benchmarks/throughput/Cargo.toml
          --all-targets
          -- -D warnings

      - name: Run throughput benchmark unit tests
        run: >-
          cargo test --locked
          --manifest-path benchmarks/throughput/Cargo.toml

      - name: Check API version recorder formatting
        run: cargo fmt --manifest-path tests/api-versions/proxy/Cargo.toml -- --check

      - name: Run Clippy on API version recorder
        run: >-
          cargo clippy --locked
          --manifest-path tests/api-versions/proxy/Cargo.toml
          --all-targets
          -- -D warnings

      - name: Test API version recorder
        run: cargo test --locked --manifest-path tests/api-versions/proxy/Cargo.toml

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Check Kafka API capability snapshot
        run: >-
          cargo run --quiet --example kafka_api_capabilities --
          --check docs/compatibility/kafka-api-capabilities.json

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Confluent.Kafka acceptance runner
        run: >-
          dotnet restore tests/confluent/MemKafka.Acceptance.csproj
          --locked-mode
          --source https://api.nuget.org/v3/index.json

      - name: Restore flow compatibility acceptance runner
        working-directory: tests/flow-compat
        run: dotnet restore --locked-mode

      - name: Build MemKafka for black-box tests
        run: cargo build

      - name: Run Confluent.Kafka native black-box tests
        run: >-
          dotnet run --no-restore
          --project tests/confluent/MemKafka.Acceptance.csproj

      - name: Run Confluent.Kafka 2.13.2 flow compatibility tests
        run: >-
          dotnet run --no-restore
          --project tests/flow-compat/MemKafka.FlowCompatibility.csproj

      - name: Build container image
        run: docker build -t memkafka:ci .

      - name: Verify container image metadata
        run: tests/container-image.sh memkafka:ci

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: tests/java/pom.xml

      - name: Install Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: tests/go-client/go.sum

      - name: Check pure-Rust client formatting
        run: >-
          cargo fmt
          --manifest-path tests/rust-client/Cargo.toml
          -- --check

      - name: Run Clippy on pure-Rust client
        run: >-
          cargo clippy --locked
          --manifest-path tests/rust-client/Cargo.toml
          --all-targets
          -- -D warnings

      - name: Check pure-Go client formatting
        working-directory: tests/go-client
        run: test -z "$(gofmt -l .)"

      - name: Verify pinned-client Kafka API versions
        env:
          MEMKAFKA_API_VERSION_ARTIFACT_DIR: artifacts/api-versions
        run: tests/api-versions/run.sh --check

      - name: Upload Kafka API version diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kafka-api-version-diagnostics
          path: artifacts/api-versions
          if-no-files-found: warn

      - name: Start container for black-box tests
        run: >-
          docker run --detach --rm
          --name memkafka-acceptance
          --publish 9092:9092
          --publish 8081:8081
          memkafka:ci

      - name: Verify container default advertised address
        env:
          MEMKAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          MEMKAFKA_EXPECTED_ADVERTISED_ADDRESS: 127.0.0.1:9092
          MEMKAFKA_METADATA_ONLY: "true"
        run: >-
          dotnet run --no-restore
          --project tests/confluent/MemKafka.Acceptance.csproj

      - name: Run Confluent.Kafka container black-box tests
        env:
          MEMKAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          MEMKAFKA_SCHEMA_REGISTRY_URL: http://127.0.0.1:8081
        run: >-
          dotnet run --no-restore
          --project tests/confluent/MemKafka.Acceptance.csproj

      - name: Run Apache Kafka Java client black-box tests
        env:
          MEMKAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
        run: >-
          mvn --batch-mode
          --file tests/java/pom.xml
          test

      - name: Run pure-Rust Kafka client black-box tests
        env:
          MEMKAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
        run: >-
          cargo test --locked
          --manifest-path tests/rust-client/Cargo.toml

      - name: Run pure-Go Kafka client black-box tests
        env:
          MEMKAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
        working-directory: tests/go-client
        run: go test -count=1 -mod=readonly ./...

      - name: Run throughput benchmark correctness smoke
        run: |
          cargo run --release --locked --manifest-path benchmarks/throughput/Cargo.toml -- \
            --bootstrap-server 127.0.0.1:9092 \
            --messages 10000 \
            --payload-bytes 4096 \
            --partitions 8 \
            --batch-records 256 \
            --output-json /tmp/memkafka-throughput-smoke.json
          jq -e '.messages == 10000 and .valueBytes == 40960000' /tmp/memkafka-throughput-smoke.json

      - name: Run Kafbat UI black-box test
        env:
          MEMKAFKA_KAFBAT_LOG_DIR: artifacts/kafbat
        run: tests/kafbat/run.sh

      - name: Upload Kafbat diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kafbat-diagnostics
          path: artifacts/kafbat
          if-no-files-found: warn

      - name: Stop black-box test container
        if: always()
        continue-on-error: true
        run: docker rm --force memkafka-acceptance
