[package]
name = "memkafka"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "An in-memory Kafka-compatible broker for development and integration tests"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

